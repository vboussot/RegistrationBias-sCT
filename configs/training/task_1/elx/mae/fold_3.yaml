Trainer:
  Model:
    classpath: impactsynth.models:UNetpp
    UNetpp:
      outputs_criterions:
        Head:Tanh:
          targets_criterions:
            CT:
              criterions_loader:
                MAE:
                  schedulers:
                    Constant:
                      nb_step: 0
                      value: 1
                  is_loss: true
                  group: 0
                  start: 0
                  stop: None
                  accumulation: false
                  reduction: mean
            CT;MASK:
              criterions_loader:
                MAE:
                  schedulers:
                    Constant:
                      nb_step: 0
                      value: 1
                  is_loss: false
                  group: 0
                  start: 0
                  stop: None
                  accumulation: false
                  reduction: mean
      schedulers:
        StepLR:
          step_size: 10
          gamma: 0.75
          last_epoch: -1
          nb_step: 0
      optimizer:
        lr: 0.001
        betas:
        - 0.9
        - 0.999
        eps: 1e-08
        weight_decay: 0.001
        amsgrad: false
        maximize: false
        foreach: None
        capturable: false
        differentiable: false
        fused: None
        name: AdamW
      nb_channel: 5
  Dataset:
    groups_src:
      MASK:
        groups_dest:
          MASK:
            transforms: None
            patch_transforms: None
            is_input: false
      CT_ELX:
        groups_dest:
          CT:
            transforms:
              Clip:
                min_value: -1024
                max_value: 3071
                save_clip_min: true
                save_clip_max: true
                mask: None
              Normalize:
                lazy: false
                channels: None
                min_value: -1
                max_value: 1
                inverse: false
            patch_transforms: None
            is_input: false
      MR:
        groups_dest:
          MR:
            transforms:
              Clip:
                min_value: min
                max_value: percentile:99.5
                save_clip_min: false
                save_clip_max: false
                mask: None
              Normalize:
                lazy: false
                channels: None
                min_value: -1
                max_value: 1
                inverse: false
            patch_transforms: None
            is_input: true
    augmentations:
      DataAugmentation_0:
        data_augmentations:
          Flip:
            f_prob:
            - 0
            - 0.5
            - 0.5
            prob: 1
        nb: 1
    Patch:
      patch_size:
      - 1
      - 320
      - 320
      overlap: None
      pad_value: -1
      extend_slice: 4
    subset: ~./data/splits/task_1/Validation.txt
    shuffle: true
    dataset_filenames:
    #- ./data/processed/synthrad2023/Task_1/brain:a:mha
    #- ./data/processed/synthrad2023/Task_1/pelvis:a:mha
    - ./data/processed/synthrad2025/Task_1/AB:a:mha
    - ./data/processed/synthrad2025/Task_1/HN:a:mha
    - ./data/processed/synthrad2025/Task_1/TH:a:mha
    inline_augmentations: true
    batch_size: 32
    validation: ./data/splits/task_1/CrossValidation_3.txt
  train_name: Task_1/Supervised/ELX/MAE/CV_3
  manual_seed: 32
  epochs: 100
  it_validation: 2500
  it_lr_update: 2500
  autocast: false
  gradient_checkpoints: None
  gpu_checkpoints: None
  ema_decay: 0
  data_log:
  - CT/IMAGES/5
  - MR/IMAGES/5
  - Head:Tanh/IMAGES/5
  save_checkpoint_mode: ALL
  EarlyStopping:
    monitor: []
    patience: 30
    min_delta: 0.0
    mode: min
